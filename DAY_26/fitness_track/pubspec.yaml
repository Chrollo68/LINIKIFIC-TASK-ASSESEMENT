name: fitness_track
description: "A premium local-first fitness tracker built with Flutter Material 3."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  image_picker: ^1.0.0
  provider: ^6.0.1
  supabase_flutter: ^2.0.0
  supabase: ^2.0.0
  shared_preferences: ^2.2.15
  crypto: ^3.0.0
  flutter_dotenv: ^5.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/
    - assets/images/
